services:
  dev1:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: sdaintai-docker1
    ports:
      - "8081:80"

  dev2:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: sdaintai-docker2
    ports:
      - "8082:80"

  # Worked-example branch (BRANCHDEVELOPER0) for the HOW-TO-USE-YOUR-OWN-
  # BRANCH-FOR-DEVS.md walkthrough -- own name, own port, same pattern as
  # dev1/dev2 above.
  developer0:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: sdaintai-docker-developer0
    ports:
      - "8083:80"

