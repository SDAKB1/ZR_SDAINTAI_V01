# =============================================================================
# SDAINTAI Multi-Tenant SaaS - Docker Compose (Development Override)
# Simplified setup for quick local development
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================

services:
  sdaintai-srv:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount source for hot-reload during development
      - ./srv:/app/srv:ro
      - ./db:/app/db:ro
      - ./app:/app/app:ro
      - db-data:/app/db-data
    environment:
      NODE_ENV: development
      CDS_HOT_RELOAD: "true"
      # Disable multitenancy for simple local testing
      CDS_REQUIRES_MULTITENANCY: "false"
    restart: "no"

  sdaintai-mtx:
    # MTX sidecar not needed in simple dev mode
    profiles:
      - with-mtx

  dev2:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: sdaintai-docker2
    ports:
      - "8082:80"

  # Worked-example branch (BRANCHDEVELOPER0) for the HOW-TO-USE-YOUR-OWN-
  # BRANCH-FOR-DEVS.md walkthrough -- own name, own port, same pattern as
  # dev1/dev2 above.
  developer0:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: sdaintai-docker-developer0
    ports:
      - "8083:80"

  # Copy this block for each additional developer, bump the name/port:
